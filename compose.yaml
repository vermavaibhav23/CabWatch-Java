services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: cabwatch, POSTGRES_USER: cabwatch, POSTGRES_PASSWORD: local-only}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U cabwatch"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19093:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"], interval: 10s, timeout: 8s, retries: 20}
  app:
    build: .
    ports: ["127.0.0.1:18081:8080"]
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/cabwatch
      DB_USER: cabwatch
      DB_PASSWORD: local-only
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set a 16-character minimum OPERATOR_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_healthy}
volumes:
  postgres-data:
  kafka-data:
