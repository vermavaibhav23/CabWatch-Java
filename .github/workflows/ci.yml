name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPERATOR_PASSWORD: integration-ci-only-password
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:15432/cabwatch
      REDIS_PORT: '16379'
      KAFKA_BOOTSTRAP_SERVERS: localhost:19093
      PORT: '18081'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: mkdir -p backend/src/main/resources/static && cp -r frontend/dist/. backend/src/main/resources/static/
      - run: mvn -B -f backend/pom.xml verify
      - run: docker compose -p cabwatch-java-test up -d --wait postgres redis kafka
      - name: Start isolated server
        run: |
          java -Xmx512m -jar backend/target/cabwatch-1.0.0.jar > integration-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:18081/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat integration-server.log
          exit 1
      - run: OUTAGE_TEST=1 node scripts/integration.mjs
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with: {name: server-log, path: integration-server.log}
      - name: Stop isolated services
        if: always()
        run: docker compose -p cabwatch-java-test down
